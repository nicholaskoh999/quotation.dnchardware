---
# ─────────────────────────────────────────────────────────────────────────────
# cPanel Git Version Control — MANUAL deployment for quo.dnchardware.com
#
# HOW TO DEPLOY (manual, two clicks — nothing here runs on its own):
#   cPanel -> Git Version Control -> Manage
#     1. "Update from Remote"   pulls the branch into the server-side clone
#     2. "Deploy HEAD Commit"   runs the tasks below
#
# This file does NOT enable automatic deployment. cPanel executes these tasks
# only when Deploy HEAD Commit is pressed. Deployment stays manual as long as
# no post-receive hook is added to the server-side repository.
#
# NO rsync. This host does not have it. Everything below uses shell builtins
# plus mkdir, cp, wc and test — all POSIX, present on any shared-hosting
# account. No package installation is required. cmp is used as an extra check
# when present, and skipped without failing when it is not.
#
# SAFETY MODEL
#   * ALLOWLIST, not exclusions. Only the files named in APPFILES and the
#     contents of assets/icons/ are ever copied. A new file appearing in the
#     repository is NOT deployed until it is added here on purpose.
#   * Nothing is ever removed. There is no rm, no rmdir, no --delete and no
#     cleanup step anywhere in this file, so production-only files and
#     directories survive every deploy by construction.
#   * PROTECTED names are refused even if one is ever added to APPFILES by
#     mistake, so a future edit still cannot overwrite the live secrets.
#   * Two-phase: every source file is checked to exist BEFORE the first copy,
#     so a broken checkout aborts the deploy instead of half-applying it.
#   * Every copy is verified after writing — byte size always, full content
#     when cmp exists. A mismatch (disk quota, truncated write) aborts.
#
# NEVER DEPLOYED (live copies are authoritative and stay untouched):
#   ai_config.php   real OpenAI key — server-only, absent from Git
#   db.php          real database credentials — server-only, absent from Git
#   error_log       production runtime log
#   php.ini         cPanel-generated, managed via MultiPHP INI Editor
#   dnc_config.php  DNC Workspace handoff secret + canonical-users DB
#                   credentials — server-only, absent from Git
#   .htaccess       NOT in APPFILES: the two /auth/handoff/* rewrite rules are
#                   merged into the live file by hand
#                   (docs/handoff/QUOTATION-HANDOFF.md §5), never overwritten
#
# DEPLOYMENT STAMP (docs/SYSTEM-VERSION.md)
#   The last step writes ~/quotation-deploy/version.json (OUTSIDE the docroot,
#   tmp + mv, the previous one kept as version.previous.json): the deployed
#   commit, its branch, a release tag only if one of the form quo-r… points at
#   it (otherwise null, never invented), the Malaysia-time deploy time, and the
#   SHA-256 of every file copied. GET /version.php only reads it, and answers
#   503 if any live file no longer matches, so it never describes code that is
#   not live (a failed deploy, or a later deploy of an older commit).
#   Every stamp input is computed and validated in Phase 1, before any copy.
# ─────────────────────────────────────────────────────────────────────────────

deployment:
  tasks:
    # ── Target and file lists ────────────────────────────────────────────────
    - 'export DEPLOYPATH=/home5/dnchardw/quo.dnchardware.com/'
    - 'export APPFILES="index.php api.php companies.php ai_extract.php pricing_history.php auth.php login.php logout.php manifest.webmanifest ai_config.sample.php db.sample.php handoff.php dnc_handoff.php dnc_config.sample.php app/Handoff/Contract/HandoffToken.php app/Handoff/Contract/InvalidHandoffToken.php version.php"'
    - 'export PROTECTED="ai_config.php db.php dnc_config.php error_log php.ini .htaccess"'
    - 'export STAMPDIR=/home5/dnchardw/quotation-deploy/'

    # ── Phase 1: preflight. Abort before touching anything. ──────────────────
    # Braces, not parentheses: { } runs in the current shell so exit aborts the
    # whole deployment. A ( ) subshell would only end itself and the deploy
    # would carry on past a failed check.
    - 'test -d "$DEPLOYPATH" || { echo "FATAL: deploy path does not exist: $DEPLOYPATH" >&2; exit 1; }'
    - 'test -w "$DEPLOYPATH" || { echo "FATAL: deploy path is not writable: $DEPLOYPATH" >&2; exit 1; }'
    - 'for f in $APPFILES; do test -f "$f" || { echo "FATAL: source file missing from checkout: $f" >&2; exit 1; }; done'
    - 'test -d assets/icons || { echo "FATAL: assets/icons missing from checkout" >&2; exit 1; }'
    # cmp is near-universal but this host proved rsync was not, so it is treated
    # as optional. The wc -c size check below always runs and needs no package.
    - 'export CMP=$(command -v cmp)'
    - 'test -n "$CMP" || echo "NOTE: cmp not available; verifying copies by size only."'
    # Stamp inputs, validated now so a bad value aborts before anything is copied.
    - 'export DC_COMMIT=$(git rev-parse HEAD)'
    - 'echo "$DC_COMMIT" | grep -Eq "^[0-9a-f]{40}$" || { echo "FATAL: cannot read the deployed commit" >&2; exit 1; }'
    - 'export DC_BRANCH=$(git rev-parse --abbrev-ref HEAD)'
    - 'echo "$DC_BRANCH" | grep -Eq "^[A-Za-z0-9._/][A-Za-z0-9._/-]{0,99}$" && test "$DC_BRANCH" != HEAD && ! echo "$DC_BRANCH" | grep -q "\.\." || { echo "FATAL: the deployed checkout is not on a usable branch: $DC_BRANCH" >&2; exit 1; }'
    - 'export DC_RELEASE=$(git tag --points-at HEAD | grep -E "^quo-r[0-9][0-9a-z.-]{0,30}$" | head -n 1)'
    - 'test -n "$DC_RELEASE" && export DC_RELEASE_JSON="\"$DC_RELEASE\"" || export DC_RELEASE_JSON=null'
    - 'TZ=Asia/Kuala_Lumpur date "+%Y-%m-%dT%H:%M:%S%:z" | grep -Eq "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[+]08:00$" || { echo "FATAL: date cannot produce a Malaysia-time ISO 8601 stamp" >&2; exit 1; }'
    - 'command -v sha256sum > /dev/null || { echo "FATAL: sha256sum not available for the deployment stamp" >&2; exit 1; }'
    - 'mkdir -p "$STAMPDIR" && test -w "$STAMPDIR" || { echo "FATAL: stamp directory not writable: $STAMPDIR" >&2; exit 1; }'
    - 'echo "Deploying $(git rev-parse --short HEAD) ($DC_BRANCH) to $DEPLOYPATH"'

    # ── Phase 2: copy. mkdir -p is safe on an existing directory. ────────────
    - 'mkdir -p "${DEPLOYPATH}assets/icons" || { echo "FATAL: cannot create ${DEPLOYPATH}assets/icons" >&2; exit 1; }'
    - 'mkdir -p "${DEPLOYPATH}app/Handoff/Contract" || { echo "FATAL: cannot create ${DEPLOYPATH}app/Handoff/Contract" >&2; exit 1; }'
    - 'for f in $APPFILES; do case " $PROTECTED " in *" $f "*) echo "  REFUSED (production-only, never overwritten): $f"; continue;; esac; cp -f "$f" "${DEPLOYPATH}$f" || { echo "FATAL: copy failed: $f" >&2; exit 1; }; test "$(wc -c < "$f")" = "$(wc -c < "${DEPLOYPATH}$f")" || { echo "FATAL: size mismatch after copy (disk full or quota?): $f" >&2; exit 1; }; test -z "$CMP" || "$CMP" -s "$f" "${DEPLOYPATH}$f" || { echo "FATAL: content mismatch after copy: $f" >&2; exit 1; }; echo "  deployed: $f"; done'
    - 'for f in assets/icons/*; do test -f "$f" || continue; cp -f "$f" "${DEPLOYPATH}$f" || { echo "FATAL: copy failed: $f" >&2; exit 1; }; test "$(wc -c < "$f")" = "$(wc -c < "${DEPLOYPATH}$f")" || { echo "FATAL: size mismatch after copy (disk full or quota?): $f" >&2; exit 1; }; test -z "$CMP" || "$CMP" -s "$f" "${DEPLOYPATH}$f" || { echo "FATAL: content mismatch after copy: $f" >&2; exit 1; }; echo "  deployed: $f"; done'

    # ── Phase 2b: deployment stamp. Only after every copy above succeeded. ───
    - 'export DC_FILES=""; for f in $APPFILES; do h=$(sha256sum "${DEPLOYPATH}$f" | cut -c1-64); echo "$h" | grep -Eq "^[0-9a-f]{64}$" || { echo "FATAL: cannot hash deployed file: $f" >&2; exit 1; }; DC_FILES="${DC_FILES}${DC_FILES:+,}\"$f\":\"$h\""; done'
    - 'test ! -f "${STAMPDIR}version.json" || cp -p "${STAMPDIR}version.json" "${STAMPDIR}version.previous.json" || { echo "FATAL: cannot keep the previous stamp" >&2; exit 1; }'
    - 'printf "{\"system\":\"Quotation\",\"environment\":\"production\",\"release\":%s,\"branch\":\"%s\",\"commit\":\"%s\",\"deployed_at\":\"%s\",\"files\":{%s}}\n" "$DC_RELEASE_JSON" "$DC_BRANCH" "$DC_COMMIT" "$(TZ=Asia/Kuala_Lumpur date "+%Y-%m-%dT%H:%M:%S%:z")" "$DC_FILES" > "${STAMPDIR}version.json.tmp" && mv -f "${STAMPDIR}version.json.tmp" "${STAMPDIR}version.json" || { echo "FATAL: cannot write the deployment stamp" >&2; exit 1; }'
    - 'echo "  stamped: ${STAMPDIR}version.json ($DC_COMMIT, ${DC_RELEASE:-no release tag})"'

    # ── Phase 3: report. Informational; never fails the deploy. ──────────────
    - 'for f in $PROTECTED; do test -e "${DEPLOYPATH}$f" && echo "  untouched on live: $f" || echo "  not present on live (create it on the server): $f"; done'
    - 'echo "Deploy complete. Nothing was deleted from $DEPLOYPATH"'
