# QUOTATION NEXT CI — the Laravel + React application in next/.
# Builds and tests the candidate exactly as a deployment would: the frontend is
# built here (the shared host has no Node), Pest runs against the built
# manifest, Playwright drives `php artisan serve` on the built assets.
name: next-ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: next

jobs:
  next:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, pdo_sqlite, intl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: next/package-lock.json
      - name: composer install
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: npm ci
        run: npm ci
      - name: environment
        run: cp .env.example .env && php artisan key:generate
      - name: typecheck
        run: npm run typecheck
      - name: vitest (incl. R0b golden fixtures)
        run: npm test
      - name: build (production assets + release stamp)
        run: GIT_SHA=${{ github.sha }} npm run release:stamp && npm run build:vite
      - name: pest
        run: php artisan test
      - name: playwright
        run: npx playwright install --with-deps chromium && npm run e2e
